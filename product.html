<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Product Details | INSMART</title>
</head>
<body>
<header class="product-header">
    <h1>INSMART</h1>

    <a href="index.html">← Back to Home</a>
</header>

<main>

    <section class="product-details">

        <div class="product-details-image">
            <img src="images/laptop.jpg" alt="Laptop">
        </div>

        <div class="product-details-info">

            <span class="badge">Best Seller</span>

            <h2>Laptop</h2>

            <p class="product-description">
                Reliable laptop for work, study and everyday use.
            </p>

            <p class="price">Rs. 350,000</p>

            <p class="stock">In Stock</p>

            <div class="specifications">
            <h3>Specifications</h3>

            <ul>
                <li>Processor: Intel Core i5</li>
                <li>Memory: 16GB RAM</li>
                <li>Storage: 512GB SSD</li>
                <li>Display: 15.6-inch Full HD</li>
                <li>Warranty: 1 Year</li>
            </ul>
            </div>
            
            <button>Add to Cart</button>

            </div>

    </section>

</main>

<footer>
    <p>© 2026 INSMART. All rights reserved.</p>
</footer>
</body>
</html>
